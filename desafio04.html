<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 04</title>
    <link rel="stylesheet" href=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm p-4">
                    <h3 class="mb-4 text-center"><strong>Agendamento de Serviço</strong> </h3>
                    <form>
                        <div class="row g-3">

                            <div class="col-sm-6">
                                <label class="form-label">Nome completo</label>
                                <input class="form-control" type="text" placeholder="Digite seu nome completo" required>
                            </div>

                            <div class="col-sm-6">
                                <label class="form-label">Email</label>
                                <input class="form-control" type="email" placeholder="seuemail@gmail.com" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label ">Telefone</label>
                                <div class="input-group">
                                    <span class="input-group-text">(41)</span>
                                    <input type="text" class="form-control" placeholder="9999-9999">
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label ">Valor estimado</label>
                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="number" class="form-control" placeholder="00,00">
                                </div>
                            </div>
                            

                            <div class="col-12">
                                <label class="form-label">Tipo de serviço</label>
                                <select class="form-select">
                                   <option selected>Escolha uma opção..</option>
                                   <option value="1">Manutenção </option>
                                   <option value="2">instalação</option>
                                   <option value="3">Orçamento</option>
                                   <option value="4">Outro..</option>
                                </select>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label">Descreva o que precisa</label>
                                <textarea class="form-control " rows="4" type="text" placeholder="Digite os detalhes do serviço" required></textarea>
                            </div>

                            <div class="col-12">
                                <div class="form-check">
                                    <input  class="form-check-input" type="checkbox" id="termos">
                                    <label for="termos" class="form-check-label">Concordo com os termos de uso</label>
                                </div>
                            </div>

                            <div class="col-12 mt-4">
                                <button class="btn w-100" style="background-color: #f5dc8e;" type="submit">Finalizar</button>
                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="voltar text-center ">
            <a href="index.html" class="btn " style="background-color: #e7d08a;">Voltar</a>
        </div>

    </div>
    
</body>
</html>
